services:
  - type: web
    name: ar-infotech
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_NAME
        value: arinfotech
      - key: MONGODB_URI
        sync: false
